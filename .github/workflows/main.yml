name: CI

# Two triggers:
#   * workflow_dispatch - build both legs on demand from the Actions tab.
#   * release (prereleased) - original behaviour: build and attach the exe to the
#     prerelease as an asset.
on:
  workflow_dispatch:
  release:
    types: [prereleased]

# Needed only by the release-asset upload step, which uses the auto-provided
# GITHUB_TOKEN. No other secrets are used anywhere in this workflow, and a Discord
# token must never be added to CI.
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.leg }})
    runs-on: windows-latest

    strategy:
      # One leg failing must still produce the other leg's artifact - the whole point
      # of the baseline leg is to have a control when the modern leg misbehaves.
      fail-fast: false
      matrix:
        include:
          # Modernized build: Python 3.12 / PyInstaller 6.x / PyQt6.
          - leg: modern
            python_version: '3.12'
            pyinstaller: 'pyinstaller==6.22.2'
            requirements: 'build/requirements.txt'
            spec: './build/main.spec'
            source_ref: ''
            artifact: 'dap-modern-win64'
            asset_suffix: ''

          # Control build: the exact pre-modernization toolchain, pins, spec AND
          # application sources. source_ref is the last upstream commit before the
          # PyQt6 migration; it is checked back out over the working tree so the
          # PyQt5 sources are what actually gets frozen.
          - leg: baseline
            python_version: '3.10'
            pyinstaller: 'pyinstaller==5.1'
            requirements: 'build/requirements-baseline.txt'
            spec: './build/main-baseline.spec'
            source_ref: 'b9ea7bf'
            artifact: 'dap-baseline-win64'
            asset_suffix: '-baseline'

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the baseline leg can check out the pre-modernization
          # application sources by commit.
          fetch-depth: 0

      - name: Restore pre-modernization application sources
        if: matrix.source_ref != ''
        run: |
          git checkout ${{ matrix.source_ref }} -- main.pyw gui.py sound.py cli.py assets
          git --no-pager diff --stat HEAD -- main.pyw gui.py sound.py cli.py assets

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          architecture: 'x64'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          pip install ${{ matrix.pyinstaller }}
          pip install -r ${{ matrix.requirements }}

      - name: Report resolved toolchain and dependency versions
        run: |
          python --version
          pip --version
          pyinstaller --version
          echo "----- pip freeze -----"
          pip freeze

      - name: Compile to exe
        run: pyinstaller ${{ matrix.spec }}

      - name: Report build output
        run: |
          Get-ChildItem -Path ./dist | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/dap.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach exe to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $uploadPath = "./dist/dap.exe"
          $fileName = "dap-${{ github.event.release.tag_name }}-win64${{ matrix.asset_suffix }}"
          $uri = "https://uploads.github.com/repos/$Env:GITHUB_REPOSITORY/releases/${{ github.event.release.id }}/assets?name=$fileName.exe"
          $headers = @{
            "Content-Type"  = "application/x-msdownload"
            "Authorization" = "token $Env:GITHUB_TOKEN"
          }
          Invoke-WebRequest -Uri $uri -Method POST -Headers $headers -InFile $uploadPath
